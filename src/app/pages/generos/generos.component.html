<div class="contenedor">

  <div class="encabezado">

    <div>
      <h1>Géneros</h1>

      <p>
        Administración de géneros
      </p>
    </div>

    <button
      mat-raised-button
      color="primary"
      (click)="nuevoGenero()">

      <mat-icon>add</mat-icon>

      Nuevo género

    </button>

  </div>

  @if (mostrarFormulario) {

    <mat-card class="formulario">

      <mat-card-header>

        <mat-card-title>
          {{ editando ? 'Editar género' : 'Nuevo género' }}
        </mat-card-title>

      </mat-card-header>

      <mat-card-content>

        <mat-form-field
          appearance="outline"
          class="campo">

          <mat-label>
            Nombre del género
          </mat-label>

          <input
            matInput
            [(ngModel)]="generoSeleccionado.nombre"
            placeholder="Ej. Masculino">

        </mat-form-field>

      </mat-card-content>

      <mat-card-actions>

        <button
          mat-button
          (click)="cancelar()">

          Cancelar

        </button>

        <button
          mat-raised-button
          color="primary"
          (click)="guardarGenero()">

          <mat-icon>save</mat-icon>

          {{ editando ? 'Actualizar' : 'Guardar' }}

        </button>

      </mat-card-actions>

    </mat-card>
  }

  <mat-card class="tabla-card">

    <table
      mat-table
      [dataSource]="generos"
      class="tabla">

      <ng-container matColumnDef="nombre">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Género

        </th>

        <td
          mat-cell
          *matCellDef="let genero">

          {{ genero.nombre }}

        </td>

      </ng-container>

      <ng-container matColumnDef="acciones">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Acciones

        </th>

        <td
          mat-cell
          *matCellDef="let genero">

          <button
            mat-icon-button
            color="primary"
            (click)="editarGenero(genero)"
            matTooltip="Editar">

            <mat-icon>edit</mat-icon>

          </button>
          @if (authService.esAdministrador()) {
          <button
    mat-icon-button
    color="warn"
    (click)="eliminarGenero(genero)"
    matTooltip="Eliminar">

    <mat-icon>
      delete
    </mat-icon>

  </button>
          }
        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="columnas">
      </tr>

      <tr
        mat-row
        *matRowDef="let row; columns: columnas;">
      </tr>

    </table>

    @if (generos.length === 0) {

      <div class="sin-datos">

        <mat-icon>person</mat-icon>

        <p>
          No hay géneros registrados.
        </p>

        <button
          mat-raised-button
          color="primary"
          (click)="nuevoGenero()">

          Agregar primer género

        </button>

      </div>

    }

  </mat-card>

</div>
